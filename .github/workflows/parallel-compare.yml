name: Parallel Compare (prod vs dev)

# ───────────────────────────────────────────────────────────────────────────
# Triggers on the *completion* of either briefing workflow. Two outputs:
#
#   1. Per-run report (`scripts/run_report.py`) — ALWAYS emitted on every
#      successful briefing completion. For dev fires this is committed
#      to dev as `data/run_report_dev_latest.md`. For prod fires it is
#      attached as an artifact only (we never push to main).
#
#   2. Paired comparison (`scripts/parallel_compare.py`) — additionally
#      emitted when BOTH branches have committed within the last 24h,
#      so the comparison is apples-to-apples for the week.
#
# Self-coordinating — no shared state between the two briefing files.
# Either order of completion works (prod-first or dev-first).
# ───────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows:
      - 'Weekly Macro Update'
      - 'Weekly Macro Update (DEV — parallel)'
    types: [completed]
  workflow_dispatch:

# Opt into Node.js 24 runner (default from 2026-06-16; Node.js 20 removed 2026-09-16).
# Standard actions (checkout, setup-python, upload-artifact, github-script) are
# compatible. Proactively set so the forced cutover on June 16 has no surprises.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  compare:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded. (Failed runs would
    # produce a misleading report against potentially stale artifacts.)
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Identify triggering branch
        id: trigger
        run: |
          # Determine which briefing fired this run. The dev workflow's
          # display name contains "DEV"; everything else is treated as prod.
          NAME="${{ github.event.workflow_run.name }}"
          if echo "$NAME" | grep -qi "DEV"; then
            echo "branch=dev" >> $GITHUB_OUTPUT
            echo "ref=dev/multi-expert-improvements" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "ref=main" >> $GITHUB_OUTPUT
          fi
          # workflow_dispatch falls through to dev-as-default (manual
          # debugging is almost always against dev).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=dev" >> $GITHUB_OUTPUT
            echo "ref=dev/multi-expert-improvements" >> $GITHUB_OUTPUT
          fi
          echo "Triggering workflow: $NAME"
          echo "Resolved branch: $(grep '^branch=' $GITHUB_OUTPUT | tail -1)"

      - name: Checkout dev branch (artifact destination)
        uses: actions/checkout@v6
        with:
          ref: dev/multi-expert-improvements
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch main for cross-ref comparison
        run: |
          git fetch origin main:main
          echo "main HEAD: $(git rev-parse main)"
          echo "dev HEAD:  $(git rev-parse HEAD)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ─────────────────────────────────────────────────────────────────
      # Step A: per-run report for whichever branch triggered this run.
      # Fires every time. No freshness gate.
      # ─────────────────────────────────────────────────────────────────
      - name: Generate per-run report
        id: run_report
        run: |
          python scripts/run_report.py \
            --ref "${{ steps.trigger.outputs.ref }}" \
            --branch "${{ steps.trigger.outputs.branch }}"

      - name: Commit per-run report to dev (dev fires only)
        if: steps.trigger.outputs.branch == 'dev'
        run: |
          git config user.name  "parallel-compare-bot"
          git config user.email "parallel-compare-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add data/run_report_dev_*.md
          if git diff --staged --quiet; then
            echo "No run-report changes"
          else
            git commit -m "📋 Run report (dev): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:dev/multi-expert-improvements
          fi

      - name: Upload per-run report artifact
        uses: actions/upload-artifact@v7
        with:
          name: run-report-${{ steps.trigger.outputs.branch }}-${{ github.run_id }}
          path: data/run_report_${{ steps.trigger.outputs.branch }}_*.md
          retention-days: 30

      # ─────────────────────────────────────────────────────────────────
      # Step B: paired comparison — only when BOTH branches have a fresh
      # commit (<24h). Skipped on solo fires so we don't compare today's
      # dev against last week's prod.
      # ─────────────────────────────────────────────────────────────────
      - name: Check freshness of both branches
        id: freshness
        run: |
          NOW=$(date +%s)
          MAIN_TS=$(git log -1 --format=%ct main)
          DEV_TS=$(git log -1 --format=%ct HEAD)
          MAIN_AGE_HOURS=$(( (NOW - MAIN_TS) / 3600 ))
          DEV_AGE_HOURS=$(( (NOW - DEV_TS) / 3600 ))
          echo "Main last commit: ${MAIN_AGE_HOURS}h ago"
          echo "Dev last commit:  ${DEV_AGE_HOURS}h ago"
          if [ $MAIN_AGE_HOURS -gt 24 ] || [ $DEV_AGE_HOURS -gt 24 ]; then
            echo "One branch is stale (>24h since last commit) — skipping paired comparison."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate paired comparison report
        if: steps.freshness.outputs.skip != 'true'
        run: python scripts/parallel_compare.py

      - name: Commit paired comparison to dev
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name  "parallel-compare-bot"
          git config user.email "parallel-compare-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # data/parallel_findings_ledger.md is written by BOTH run_report.py
          # (Step A, above) and parallel_compare.py (this step) but was staged
          # by neither commit step — leaving it modified-but-uncommitted after
          # every run. That leftover dirty file then made git pull --rebase
          # below fail with "You have unstaged changes" on every single run
          # where Step B actually executes (100% reproducible, confirmed via
          # runs 29980661506 and 30422227500), silently discarding the
          # generated report every time. Also stage run_report_*.md here as a
          # backstop: when the triggering branch is 'main', "Commit per-run
          # report to dev" above is skipped (dev-only gate), so those files
          # would otherwise hit the same unstaged-changes failure too.
          git add data/parallel_compare_*.md data/parallel_findings_ledger.md data/run_report_*.md
          if git diff --staged --quiet; then
            echo "No comparison report changes"
          else
            git commit -m "📊 Parallel compare: $(date -u +'%Y-%m-%d')"
            git push origin HEAD:dev/multi-expert-improvements
          fi

      - name: Upload paired comparison artifact
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: parallel-compare-${{ github.run_id }}
          path: data/parallel_compare_*.md
          retention-days: 30
