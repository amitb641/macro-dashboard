name: Agent 9 — Earnings Agent (quarterly)

# Runs autonomously during earnings weeks only.
# Bank Q-results typically land days 10-28 of Jan / Apr / Jul / Oct.
# Outside those windows this workflow is dormant.
#
# Design: Agent 9 never modifies the main briefing.yml pipeline or its
# cadence. If Agent 9's validator gate fails, it exits non-zero WITHOUT
# commit/push, so a bad extraction never reaches the published site.

on:
  schedule:
    # Daily at 22:00 UTC (6pm ET / 3pm PT), days 10-28 of Jan/Apr/Jul/Oct.
    # This is post-market on the US East Coast, so same-day earnings calls
    # are typically already transcribed by the time this fires.
    - cron: '0 22 10-28 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Process only one ticker (e.g. JPM)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no commits/pushes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: earnings-agent
  cancel-in-progress: false

# Opt into Node.js 24 runner (default from 2026-06-16; Node.js 20 removed 2026-09-16).
# Standard actions (checkout, setup-python, upload-artifact, github-script) are
# compatible. Proactively set so the forced cutover on June 16 has no surprises.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for git commit/push back to main
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Configure git identity
        run: |
          git config user.name "agent-9-earnings[bot]"
          git config user.email "agent-9-earnings[bot]@users.noreply.github.com"

      - name: Run Agent 9
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.ticker }}" ]; then ARGS="$ARGS --ticker ${{ inputs.ticker }}"; fi
          python scripts/earnings_agent.py $ARGS

      - name: Summary
        if: always()
        run: |
          echo "## Agent 9 run — $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: $?" >> $GITHUB_STEP_SUMMARY
          if [ -f data/bank_earnings.json ]; then
            REPORTED=$(python -c "import json; d=json.load(open('data/bank_earnings.json')); print(sum(1 for b in d['banks'] if b.get('status')=='reported'))")
            TOTAL=$(python -c "import json; d=json.load(open('data/bank_earnings.json')); print(len(d['banks']))")
            echo "Banks reported: $REPORTED / $TOTAL" >> $GITHUB_STEP_SUMMARY
          fi
