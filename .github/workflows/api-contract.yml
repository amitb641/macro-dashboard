name: API Contract Test

on:
  schedule:
    # Tuesdays 6am ET (10:00 UTC) — mid-week check, well before Friday pipeline
    - cron: '0 10 * * 2'
  workflow_dispatch:

# Opt into Node.js 24 runner (default from 2026-06-16; Node.js 20 removed 2026-09-16).
# Standard actions (checkout, setup-python, upload-artifact, github-script) are
# compatible. Proactively set so the forced cutover on June 16 has no surprises.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Test API contracts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY:  ${{ secrets.BLS_API_KEY }}
          EIA_API_KEY:  ${{ secrets.EIA_API_KEY }}
        run: python tests/test_api_contracts.py

  notify-api-break:
    runs-on: ubuntu-latest
    needs: api-check
    if: failure()
    steps:
      - name: Create issue for API contract break
        uses: actions/github-script@v9
        with:
          script: |
            const title = `API contract break detected: ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## API Contract Test Failure',
              '',
              'One or more data source APIs have changed their response format.',
              'This will likely break the Friday pipeline run if not addressed.',
              '',
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Action Required',
              '- Check which API endpoint changed',
              '- Update collector.py to handle the new format',
              '- Run smoke tests to verify the fix',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['api-break'],
            });
