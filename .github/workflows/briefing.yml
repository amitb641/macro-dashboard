name: Weekly Macro Update

# ───────────────────────────────────────────────────────────────────────────
# Schedule contract (confirmed against actual UTC behaviour)
#
#   Cron                Local time (US/Eastern)
#   ─────────────────── ───────────────────────────────────────
#   0 12 * * 6          Sat 08:00 EDT  /  Sat 07:00 EST   ← weekly
#   0 14 8-14 * 6       2nd Sat 10:00 EDT / 09:00 EST     ← monthly deep
#
# Why Saturday and not "Friday 8am ET":
#   - BLS Employment Situation (NFP) prints Fri 08:30 ET
#   - FRED morning batches typically updated Fri afternoon ET
#   - Running Saturday lets the pipeline pick up Friday prints cleanly
#
# DST: GitHub crons are UTC-only. The hour drifts ±1h vs local time twice
# a year. If a fixed local-clock launch is required, add a second cron and
# gate by month (or accept the 1h drift — documented and intentional).
# ───────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '0 12 * * 6'        # Weekly: Sat 08:00 EDT / 07:00 EST
    - cron: '0 14 8-14 * 6'     # Monthly deep: 2nd Sat 10:00 EDT / 09:00 EST
  push:
    # Only main may trigger the publish pipeline on push. The github-pages
    # environment has a branch policy restricted to `main`, so pushes from
    # any other branch were producing startup-failure runs (0 jobs, 0
    # check-runs) with a vague "workflow file issue" hint. Restricting the
    # push trigger here makes feature branches green-by-skip and keeps the
    # CI signal honest. Manual workflow_dispatch from any branch still
    # works for ad-hoc reruns.
    branches: [main]
  workflow_dispatch:
    inputs:
      force_ai:
        description: 'Force Agent 3 (Claude AI) to run'
        required: false
        default: 'true'
      strict_gate:
        description: 'Treat ceo_grade_gate WARN as blocking. Scheduled cron runs always use --strict; this input only affects workflow_dispatch.'
        required: false
        default: 'true'

jobs:
  update:
    runs-on: ubuntu-latest
    # Belt-and-suspenders gate: even if GitHub somehow triggers this on a
    # non-main ref (the explicit `push: branches: [main]` above should
    # already prevent that), skip the job cleanly. github-pages env policy
    # blocks non-main refs at startup, producing red 0-job runs; skipping
    # via `if:` yields a "skipped" outcome instead of "failed".
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check setup
        run: |
          echo "FRED key set:   ${{ secrets.FRED_API_KEY != '' }}"
          echo "BLS key set:    ${{ secrets.BLS_API_KEY != '' }}"
          echo "EIA key set:    ${{ secrets.EIA_API_KEY != '' }}"
          echo "Claude key set:  ${{ secrets.ANTHROPIC_API_KEY != '' }}"
          echo "Resend key set:  ${{ secrets.RESEND_API_KEY != '' }}"
          ls scripts/
          ls data/ || echo "data/ missing"

      - name: Agent 0 — Pre-flight (FRED + Anthropic model validation)
        env:
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/preflight.py

      - name: Agent 1 — Collector
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY:  ${{ secrets.BLS_API_KEY }}
          EIA_API_KEY:  ${{ secrets.EIA_API_KEY }}
        run: python scripts/collector.py

      - name: Agent 2 — Analyzer
        run: python scripts/analyzer.py

      - name: Agent 3 — Analyst (claude-sonnet-4-6)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_AI: ${{ github.event.inputs.force_ai || 'false' }}
        run: |
          echo "Running Agent 3 — AI commentary refresh"
          python scripts/briefing_agent.py

      - name: Agent 4 — Renderer
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/renderer.py

      - name: Agent 6 — Validator
        id: validator
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY:  ${{ secrets.BLS_API_KEY }}
        run: python scripts/validator.py
        continue-on-error: true

      - name: Agent 10 — Repair Agent (observer mode)
        if: always()
        run: python scripts/repair_agent.py
        continue-on-error: true

      - name: Agent 4b — Re-render (inject validation report)
        # --strict: validator has run, so any re.subn returning 0 replacements
        # is a real injection failure (stale data shipping risk), not a
        # JSON-shape drift we haven't caught yet. Exits 2 on silent miss.
        run: python scripts/renderer.py --strict

      - name: Gate — Block publish on critical validation failures
        if: steps.validator.outcome == 'failure'
        run: |
          echo "❌ Validator detected critical data divergences."
          echo "   Review data/validation_report.json for details."
          echo "   Pipeline halted — fix data quality issues before publishing."
          exit 1

      # ───────────────────────────────────────────────────────────────
      # CEO-grade gate stack (B1.1)
      # Run visual_qa + visual_review + editorial_review so the gate
      # has all six layers to aggregate. Each is continue-on-error so
      # ceo_grade_gate can produce a partial verdict (SKIP layers) rather
      # than burying the verdict because one auxiliary check failed.
      # ───────────────────────────────────────────────────────────────
      - name: Agent 7 — Visual QA (DOM checks)
        id: visual_qa
        run: python scripts/visual_qa.py
        continue-on-error: true

      - name: Agent 8 — Visual Review (Claude vision)
        id: visual_review
        # NOTE: cannot use `if: secrets.X != ''` at step level — the
        # `secrets` context is not available in step-level if-expressions
        # and triggers a workflow-startup error ("workflow file issue",
        # 0 jobs). Instead, gate inside the run: script and fall through
        # cleanly when the key is absent (continue-on-error catches any
        # actual script failure).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping visual_review."
            exit 0
          fi
          python scripts/visual_review.py
        continue-on-error: true

      - name: Editorial Review (deterministic linters, LLM tone optional)
        id: editorial_review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_EDITORIAL_REVIEW_ENABLED: '1'
        run: python -m scripts._editorial_review
        continue-on-error: true

      - name: CEO-Grade Gate — aggregated PASS/WARN/FAIL/SKIP verdict
        id: ceo_grade_gate
        run: |
          # Scheduled cron runs are the live CEO publication path — always
          # treat WARN as blocking. Manual workflow_dispatch may opt out by
          # setting strict_gate=false (e.g. for diagnostic reruns where the
          # operator has already vetted the WARN cause).
          STRICT_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STRICT_FLAG="--strict"
            echo "🔒 Scheduled publication run — --strict on by default"
          elif [ "${{ github.event.inputs.strict_gate }}" != "false" ]; then
            STRICT_FLAG="--strict"
            echo "🔒 Strict gate enabled — WARN will block publish"
          else
            echo "⚠ Strict gate off — WARN will not block (workflow_dispatch override)"
          fi
          python scripts/ceo_grade_gate.py $STRICT_FLAG
        continue-on-error: true

      - name: Gate — Block on CEO-grade FAIL/SKIP
        if: steps.ceo_grade_gate.outcome == 'failure'
        run: |
          echo "❌ CEO-grade gate did not return PASS/WARN."
          echo "   Review data/ceo_grade_verdict.json — publish halted."
          cat data/ceo_grade_verdict.json || true
          exit 1

      - name: Snapshot — Rolling data backup
        run: python scripts/snapshot.py

      - name: Version Tracker — Record pipeline run
        run: python scripts/version_tracker.py

      - name: Commit and push
        run: |
          git config user.name  "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add index.html data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Weekly update: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Health Check — Verify deployed page
        id: healthcheck
        if: steps.deploy.outputs.page_url
        run: python scripts/healthcheck.py "${{ steps.deploy.outputs.page_url }}"

      # ───────────────────────────────────────────────────────────────
      # Publisher moved AFTER healthcheck (B1.2)
      # Email goes out only when the deployed page is verified healthy.
      # ───────────────────────────────────────────────────────────────
      - name: Agent 5 — Publisher (email after healthy deploy)
        if: steps.healthcheck.outcome == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python scripts/publisher.py

      - name: Auto-rollback on health check failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          # Pick the second-newest snapshot (N-1). The snapshot step earlier
          # in this run wrote today's snapshot from the SAME broken data we
          # just deployed, so `head -1` would roll back to the broken state.
          # `head -2 | tail -1` selects the previous run's snapshot — the
          # last known-good state.
          PREV_SNAPSHOT="$(ls -1 data/snapshots/ 2>/dev/null | sort -r | head -2 | tail -1)"
          if [ -z "$PREV_SNAPSHOT" ]; then
            echo "⚠️ Health check failed but no prior snapshot exists — cannot rollback."
            echo "    Live page will remain broken until next scheduled run."
            exit 0
          fi
          echo "⚠️ Health check failed — rolling back to snapshot $PREV_SNAPSHOT"
          python scripts/snapshot.py --rollback "$PREV_SNAPSHOT" --include-html
          python scripts/renderer.py
          git add index.html data/
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Auto-rollback to $PREV_SNAPSHOT: health check failed $(date -u +'%Y-%m-%d')"
            git push
            # Re-deploy the rolled-back artifact. Without this, the repo is
            # restored but the live Pages URL still serves the broken build.
            echo "    Pushed rollback commit; next scheduled run will redeploy."
            echo "    For immediate live recovery, trigger workflow_dispatch."
          fi

  # ── Pipeline failure notification ──────────────────────────────────
  notify-failure:
    runs-on: ubuntu-latest
    needs: update
    # Only file failure issues for runs that actually executed the pipeline
    # (main pushes, scheduled runs, manual dispatches). Skip on feature
    # branches whose `update` job is gated off.
    if: failure() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      issues: write
    steps:
      - name: Notify pipeline failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Pipeline failure: ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Pipeline Failure Alert',
              '',
              `**Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Trigger:** ${context.eventName}`,
              `**Time:** ${new Date().toISOString()}`,
              '',
              'Review the failed run and fix before next scheduled execution.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['pipeline-failure'],
            });
